name: External Trigger Receiver

on:
  repository_dispatch:
    types: [run-demo]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            https://api.github.com/repos/IAKalash/Advanced-Transit-Detection-System/actions/workflows/demo.yaml/dispatches \
            -d '{"ref":"main"}'