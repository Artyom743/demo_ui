name: Trigger Private Demo

on:
  workflow_dispatch:

env:
  PRIVATE_OWNER: "IAKalash"
  PRIVATE_REPO: "Advanced-Transit-Detection-System"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Запустить приватный workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            https://api.github.com/repos/${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}/actions/workflows/demo.yaml/dispatches \
            -d '{"ref":"main"}'
      
      - name: Ждать завершения
        run: |
          echo "Ожидание завершения демо (около 2-3 минут)..."
          sleep 150
      
      - name: Получить последний run ID
        id: get-run
        run: |
          RUNS=$(curl -s -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            "https://api.github.com/repos/${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}/actions/runs?per_page=1")
          RUN_ID=$(echo "$RUNS" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Найден run_id: $RUN_ID"
      
      - name: Скачать артефакты из приватного репозитория
        uses: actions/download-artifact@v4
        with:
          name: crop-results
          path: ./results
          github-token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repository: ${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}
          run-id: ${{ steps.get-run.outputs.run_id }}
      
      - name: Удалить старый артефакт (если есть)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const artifact of artifacts.artifacts) {
              if (artifact.name === 'public-demo-results') {
                console.log(`Удаляю старый артефакт: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      
      - name: Загрузить новый артефакт
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-results
          path: ./results